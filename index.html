<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halloween Dumpling Empire — Fixed Edition</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        halloween: {
                            base: '#0c0814',
                            surface: '#151022',
                            card: '#1e1633',
                            border: 'rgba(249, 115, 22, 0.15)',
                            orange: '#f97316',
                            purple: '#a855f7',
                            glow: '#ea580c'
                        }
                    },
                    boxShadow: {
                        'glass': '0 10px 30px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05)',
                        'dumpling': '0 0 40px rgba(249, 115, 22, 0.35), inset 0 0 15px rgba(234, 88, 12, 0.4)',
                        'crit': '0 0 50px rgba(168, 85, 247, 0.6)'
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0c0814;
            color: #f3f4f6;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        .game-hero-bg {
            background: 
                radial-gradient(circle at 50% 20%, rgba(168, 85, 247, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(249, 115, 22, 0.12) 0%, transparent 50%),
                linear-gradient(180deg, #0c0814 0%, #06040a 100%);
        }

        .glass-panel {
            background: rgba(21, 16, 34, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(249, 115, 22, 0.15);
        }

        .glass-button {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid rgba(249, 115, 22, 0.2);
            transition: all 0.15s ease;
        }

        .glass-button:active {
            transform: scale(0.96);
            border-color: rgba(249, 115, 22, 0.6);
        }

        .dumpling-btn {
            transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 2px 6px rgba(255,255,255,0.3);
        }

        .dumpling-btn:active {
            transform: scale(0.88) rotate(-3deg);
        }

        @keyframes floatNumber {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.1); }
        }

        .float-val {
            position: absolute;
            animation: floatNumber 0.75s cubic-bezier(0, 0.9, 0.1, 1) forwards;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            z-index: 50;
        }

        @keyframes orbitSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .orbit-ring {
            animation: orbitSpin 30s linear infinite;
        }

        .wheel-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto;
        }

        .wheel-spinner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 4px solid #f97316;
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
            background: conic-gradient(
                #1e1633 0deg 60deg,
                #f97316 60deg 120deg,
                #2a1b4e 120deg 180deg,
                #a855f7 180deg 240deg,
                #1e1633 240deg 300deg,
                #ea580c 300deg 360deg
            );
        }

        .wheel-segment {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 18px solid #f97316;
            z-index: 30;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(249, 115, 22, 0.3); border-radius: 4px; }
    </style>
</head>
<body class="game-hero-bg min-h-screen flex flex-col justify-between p-2.5 sm:p-4 text-slate-200">

    <!-- TOP HEADER -->
    <header class="w-full max-w-4xl mx-auto glass-panel rounded-2xl p-3 flex flex-col sm:flex-row justify-between items-center gap-3 shadow-glass z-20">
        <div class="flex items-center justify-between w-full sm:w-auto gap-3">
            <button onclick="openModal('modalProfile')" class="flex items-center space-x-2.5 text-left active:opacity-80">
                <div id="headerAvatar" class="w-11 h-11 rounded-xl bg-gradient-to-br from-orange-500/20 to-purple-500/20 border border-orange-500/40 flex items-center justify-center text-2xl shadow-dumpling">
                    🧙‍♂️
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <span id="headerPlayerName" class="font-extrabold text-white text-sm">Чаклун</span>
                        <i class="fa-solid fa-pen-to-square text-[10px] text-orange-400"></i>
                    </div>
                    <span id="headerPlayerTitle" class="text-[9px] font-bold tracking-wider text-orange-400 uppercase">[ Учень ]</span>
                </div>
            </button>

            <div class="flex items-center gap-1.5 sm:hidden bg-[#151022] px-3 py-1.5 rounded-xl border border-orange-500/20">
                <span id="dumplingValMobile" class="text-xl font-black text-orange-400 font-mono">0</span>
                <span class="text-xs">🥟</span>
            </div>
        </div>

        <div class="hidden sm:flex items-center gap-2">
            <span id="dumplingVal" class="text-2xl font-black text-orange-400 font-mono">0</span>
            <span class="text-xs font-bold text-orange-500/70">🥟</span>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
            <div class="glass-panel px-2.5 py-1.5 rounded-xl flex items-center gap-1.5 text-xs">
                <i class="fa-solid fa-ghost text-orange-400"></i>
                <span id="clickPowerVal" class="font-extrabold font-mono text-white">1</span>
            </div>
            <div class="glass-panel px-2.5 py-1.5 rounded-xl flex items-center gap-1.5 text-xs">
                <i class="fa-solid fa-wand-sparkles text-purple-400"></i>
                <span id="cpsVal" class="font-extrabold font-mono text-purple-300">0</span>
            </div>
            <button onclick="toggleAudioEngine()" id="audioBtn" class="glass-button p-2 rounded-xl text-xs font-bold text-slate-300">
                <i id="audioIcon" class="fa-solid fa-volume-xmark text-orange-500"></i>
            </button>
        </div>
    </header>

    <!-- MAIN GAME LAYOUT -->
    <main class="w-full max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-4 my-4 items-start">

        <!-- TAP ARENA -->
        <section id="arenaSection" class="lg:col-span-7 glass-panel rounded-2xl p-5 sm:p-6 flex flex-col items-center justify-center relative min-h-[380px] sm:min-h-[440px] shadow-glass overflow-hidden">
            
            <div class="absolute top-4 left-4 text-[10px] text-purple-300 font-bold bg-purple-500/10 px-2.5 py-1 rounded-full border border-purple-500/20 uppercase">
                <span id="rankTitleDisplay">Учень</span>
            </div>

            <div class="absolute top-4 right-4 text-[10px] text-orange-400 font-bold bg-orange-500/10 px-2.5 py-1 rounded-full border border-orange-500/20 flex items-center gap-1">
                <i class="fa-solid fa-cloud-moon text-[9px]"></i> <span>Туман</span>
            </div>

            <div class="relative flex items-center justify-center my-6">
                <div class="absolute w-52 h-52 sm:w-60 sm:h-60 rounded-full border border-orange-500/20 orbit-ring pointer-events-none"></div>
                <div class="absolute w-60 h-60 sm:w-68 sm:h-68 rounded-full border border-dashed border-purple-500/20 orbit-ring pointer-events-none" style="animation-direction: reverse;"></div>

                <button id="mainClickTarget" onclick="handleTap(event)" class="dumpling-btn w-44 h-44 sm:w-48 sm:h-48 rounded-full bg-gradient-to-tr from-amber-700 via-orange-600 to-yellow-500 border-4 border-orange-400/40 flex items-center justify-center text-7xl sm:text-8xl relative z-10 outline-none cursor-pointer">
                    <span id="dumplingEmoji" class="filter drop-shadow-2xl">🎃</span>
                </button>
            </div>

            <div class="grid grid-cols-4 gap-1.5 w-full mt-2">
                <button onclick="openModal('modalProfile')" class="glass-button py-2 rounded-xl text-[11px] font-bold text-purple-300 flex flex-col items-center gap-1 border-purple-500/30"><i class="fa-solid fa-user-gear text-purple-400 text-sm"></i> Профіль</button>
                <button onclick="openModal('modalPromo')" class="glass-button py-2 rounded-xl text-[11px] font-bold text-emerald-300 flex flex-col items-center gap-1 border-emerald-500/30"><i class="fa-solid fa-ticket text-emerald-400 text-sm"></i> Промо</button>
                <button onclick="openModal('modalPets')" class="glass-button py-2 rounded-xl text-[11px] font-bold text-amber-300 flex flex-col items-center gap-1 border-amber-500/30"><i class="fa-solid fa-cat text-amber-400 text-sm"></i> Фамільяри</button>
                <button onclick="openModal('modalSkills')" class="glass-button py-2 rounded-xl text-[11px] font-bold text-blue-300 flex flex-col items-center gap-1 border-blue-500/30"><i class="fa-solid fa-diagram-project text-blue-400 text-sm"></i> Таланти</button>
                <button onclick="openModal('modalAchievements')" class="glass-button py-2 rounded-xl text-[11px] font-bold text-yellow-300 flex flex-col items-center gap-1 border-yellow-500/30"><i class="fa-solid fa-trophy text-yellow-400 text-sm"></i> Ачівки</button>
                <button onclick="openModal('modalDaily')" class="glass-button py-2 rounded-xl text-[11px] font-bold text-emerald-300 flex flex-col items-center gap-1 border-emerald-500/30"><i class="fa-solid fa-calendar-days text-emerald-400 text-sm"></i> Щодня</button>
                <button onclick="openModal('modalWheel')" class="glass-button py-2 rounded-xl text-[11px] font-bold text-purple-300 flex flex-col items-center gap-1 border-purple-500/40"><i class="fa-solid fa-dharmachakra text-purple-400 text-sm"></i> Колесо</button>
                <button onclick="openModal('modalMarket')" class="glass-button py-2 rounded-xl text-[11px] font-bold text-yellow-300 flex flex-col items-center gap-1 border-yellow-500/30"><i class="fa-solid fa-coins text-yellow-400 text-sm"></i> Біржа</button>
            </div>
            <button onclick="openModal('modalSkins')" class="w-full mt-1.5 glass-button py-2 rounded-xl text-xs font-bold text-orange-300 flex items-center justify-center gap-1.5 border-orange-500/30"><i class="fa-solid fa-moon text-orange-400"></i> Магазин скінів пельменів</button>
        </section>

        <!-- UPGRADES STORE -->
        <section class="lg:col-span-5 glass-panel rounded-2xl p-4 sm:p-5 flex flex-col space-y-3 shadow-glass">
            <div class="flex justify-between items-center pb-2 border-b border-orange-500/20">
                <h2 class="text-sm font-extrabold text-white uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-cauldron text-orange-400"></i> Темний Котел (Цехи)
                </h2>
                <span class="text-[9px] text-purple-400 font-mono font-bold">РИТУАЛ</span>
            </div>

            <div id="upgradesStoreGrid" class="flex flex-col space-y-2.5 max-h-[320px] sm:max-h-[380px] overflow-y-auto pr-1"></div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="w-full max-w-4xl mx-auto glass-panel rounded-xl p-3 flex justify-between items-center text-[11px] text-slate-400 gap-2">
        <div class="flex items-center gap-1.5">
            <i class="fa-solid fa-bolt text-purple-400 text-xs"></i>
            <span>Крит: <strong id="critChanceDisp" class="text-purple-400 font-mono">5%</strong> (x10)</span>
        </div>
        <button onclick="confirmReset()" class="text-slate-500 hover:text-red-400 transition text-[10px]">Скинути прогрес</button>
    </footer>

    <!-- MODALS -->
    <div id="modalPromo" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-5 flex flex-col space-y-3 border border-emerald-500/30">
            <div class="flex justify-between items-center border-b border-emerald-500/20 pb-2.5">
                <h3 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-ticket text-emerald-400"></i> Промокод</h3>
                <button onclick="closeModal('modalPromo')" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex gap-2">
                <input type="text" id="inputPromoCode" placeholder="КОД..." class="flex-1 bg-[#151022] border border-emerald-500/30 rounded-xl px-3 py-2 text-xs text-white font-bold uppercase focus:outline-none">
                <button onclick="activatePromoCode()" class="px-3.5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">ОК</button>
            </div>
            <span id="promoMessage" class="text-[11px] font-bold text-center min-h-[16px]"></span>
        </div>
    </div>

    <div id="modalProfile" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-5 flex flex-col space-y-4 border border-purple-500/30 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-purple-500/20 pb-2.5">
                <h3 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-user-gear text-purple-400"></i> Профіль</h3>
                <button onclick="closeModal('modalProfile')" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex flex-col space-y-2 bg-[#0c0814]/60 p-3 rounded-xl border border-purple-500/20">
                <label class="text-[10px] font-bold text-slate-400 uppercase">Нікнейм</label>
                <div class="flex gap-2">
                    <input type="text" id="inputNickname" class="flex-1 bg-[#151022] border border-purple-500/30 rounded-xl px-3 py-2 text-xs text-white font-bold">
                    <button onclick="saveNickname()" class="px-3 py-2 bg-orange-600 text-white rounded-xl text-xs font-bold">Зберегти</button>
                </div>
            </div>
            <div class="flex flex-col space-y-2 bg-[#0c0814]/80 p-3 rounded-xl border border-emerald-500/30">
                <label class="text-[10px] font-bold text-emerald-400 uppercase flex items-center gap-1"><i class="fa-solid fa-key"></i> Панель Творця</label>
                <input type="password" id="inputSecretKey" placeholder="Секретний ключ..." class="bg-[#151022] border border-emerald-500/30 rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none">
                <div class="flex gap-2">
                    <input type="text" id="newPromoName" placeholder="Код" class="flex-1 bg-[#151022] border border-emerald-500/30 rounded-xl px-2.5 py-1.5 text-xs text-white uppercase font-bold">
                    <input type="number" id="newPromoAmount" placeholder="🥟" class="w-20 bg-[#151022] border border-emerald-500/30 rounded-xl px-2.5 py-1.5 text-xs text-white font-mono font-bold">
                    <button onclick="createNewPromo()" class="px-2.5 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">+</button>
                </div>
                <span id="creatorMessage" class="text-[10px] font-bold text-emerald-300"></span>
            </div>
            <div class="flex flex-col space-y-1.5">
                <label class="text-[10px] font-bold text-slate-400 uppercase">Аватар</label>
                <div id="avatarsList" class="flex gap-1.5 flex-wrap"></div>
            </div>
            <div class="flex flex-col space-y-1.5">
                <label class="text-[10px] font-bold text-slate-400 uppercase">Титул</label>
                <div id="titlesList" class="flex flex-col gap-1.5 max-h-24 overflow-y-auto pr-1"></div>
            </div>
        </div>
    </div>

    <div id="modalMarket" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-5 flex flex-col space-y-4 border border-yellow-500/30 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-yellow-500/20 pb-2.5">
                <h3 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-coins text-yellow-400"></i> Біржа Лотів</h3>
                <button onclick="closeModal('modalMarket')" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="marketItemsContainer" class="flex flex-col gap-2.5 max-h-[60vh] overflow-y-auto pr-1"></div>
        </div>
    </div>

    <div id="modalSkins" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-5 flex flex-col space-y-4 border border-orange-500/30 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-orange-500/20 pb-2.5">
                <h3 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-moon text-orange-400"></i> Скіни</h3>
                <button onclick="closeModal('modalSkins')" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="skinsContainer" class="grid grid-cols-2 gap-2.5 max-h-[60vh] overflow-y-auto pr-1"></div>
        </div>
    </div>

    <div id="modalPets" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-5 flex flex-col space-y-4 border border-amber-500/30 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-amber-500/20 pb-2.5">
                <h3 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-cat text-amber-400"></i> Фамільяри</h3>
                <button onclick="closeModal('modalPets')" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="petsContainer" class="flex flex-col gap-2.5 max-h-[60vh] overflow-y-auto pr-1"></div>
        </div>
    </div>

    <div id="modalSkills" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-5 flex flex-col space-y-4 border border-blue-500/30 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-blue-500/20 pb-2.5">
                <h3 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-diagram-project text-blue-400"></i> Таланти</h3>
                <button onclick="closeModal('modalSkills')" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="skillsContainer" class="flex flex-col gap-2.5 max-h-[60vh] overflow-y-auto pr-1"></div>
        </div>
    </div>

    <div id="modalAchievements" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-5 flex flex-col space-y-4 border border-yellow-500/30 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-yellow-500/20 pb-2.5">
                <h3 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-trophy text-yellow-400"></i> Ачівки</h3>
                <button onclick="closeModal('modalAchievements')" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="achievementsContainer" class="flex flex-col gap-2 max-h-[60vh] overflow-y-auto pr-1"></div>
        </div>
    </div>

    <div id="modalDaily" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-5 flex flex-col items-center text-center space-y-3 border border-emerald-500/30">
            <div class="flex justify-between w-full items-center border-b border-emerald-500/20 pb-2.5">
                <h3 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-calendar-days text-emerald-400"></i> Щоденні</h3>
                <button onclick="closeModal('modalDaily')" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="dailyGrid" class="grid grid-cols-4 gap-2 w-full my-2"></div>
            <button onclick="claimDailyReward()" class="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl transition text-xs">Забрати дар</button>
        </div>
    </div>

    <div id="modalWheel" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-5 flex flex-col items-center text-center space-y-3 border border-purple-500/30">
            <div class="flex justify-between w-full items-center border-b border-purple-500/20 pb-2.5">
                <h3 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-dharmachakra text-purple-400"></i> Колесо</h3>
                <button onclick="closeModal('modalWheel')" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="wheel-container my-2">
                <div class="wheel-pointer"></div>
                <div id="wheelSpinner" class="wheel-spinner">

    <!-- AUDIO ENGINE -->
    <script>
        const AudioEngine = {
            ctx: null,
            enabled: false,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(type) {
                if (!this.enabled || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                if (type === 'tap') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(90, now + 0.1);
                    gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'crit') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.25);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now); osc.stop(now + 0.25);
                } else if (type === 'buy') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(330, now);
                    osc.frequency.setValueAtTime(550, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                }
            }
        };

        function toggleAudioEngine() {
            AudioEngine.init();
            AudioEngine.enabled = !AudioEngine.enabled;
            const icon = document.getElementById('audioIcon');
            icon.className = AudioEngine.enabled ? 'fa-solid fa-volume-high text-purple-400' : 'fa-solid fa-volume-xmark text-orange-500';
        }
    </script>

        function getStatsMultiplier() {
            let critBonus = 0.05 + (game.skills.critBoost.level * 0.03);
            return { click: 1 + (game.skills.clickBoost.level * 0.5), cps: 1, crit: critBonus };
        }

        function updateUI() {
            const mult = getStatsMultiplier();
            const formattedDumplings = Math.floor(game.dumplings).toLocaleString();
            const dumplingEl = document.getElementById('dumplingVal');
            const dumplingMobileEl = document.getElementById('dumplingValMobile');

            if (dumplingMobileEl) dumplingMobileEl.innerText = formattedDumplings;
            
            const clickValEl = document.getElementById('clickPowerVal');
            const cpsValEl = document.getElementById('cpsVal');
            const critChanceEl = document.getElementById('critChanceDisp');
            if (clickValEl) clickValEl.innerText = Math.floor(game.clickPower * mult.click);
            if (cpsValEl) cpsValEl.innerText = Math.floor(game.cps * mult.cps);
            if (critChanceEl) critChanceEl.innerText = Math.round(mult.crit * 100) + '%';

            const nameEl = document.getElementById('headerPlayerName');
            const avatarEl = document.getElementById('headerAvatar');
            if (nameEl) nameEl.innerText = game.profile.nickname;
            if (avatarEl) avatarEl.innerText = game.profile.avatar;
            
            const currentTitleObj = availableTitles.find(t => t.id === game.profile.activeTitle);
            const titleEl = document.getElementById('headerPlayerTitle');
            const rankEl = document.getElementById('rankTitleDisplay');

            if (rankEl) rankEl.innerText = currentTitleObj ? currentTitleObj.name : 'Учень';

            const container = document.getElementById('upgradesStoreGrid');
            if (container) {
                container.innerHTML = '';
                upgradeDefs.forEach(def => {
                    const upg = game.upgrades[def.id];
                    if (!upg) return;
                    const canAfford = game.dumplings >= upg.cost;
                    container.innerHTML += `
                        <div onclick="buyUpgrade('${def.id}')" class="glass-panel rounded-xl p-2.5 flex justify-between items-center transition ${canAfford ? 'hover:border-orange-500/50 cursor-pointer' : 'opacity-50'}">

                                <div class="w-8 h-8 rounded-lg bg-orange-500/10 text-orange-400 flex items-center justify-center text-xs border border-orange-500/20">

                                </div>
                                <div>
                                    <h4 class="font-bold text-[11px] text-white">${upg.name} (${upg.count})</h4>
                                    <span class="text-[9px] text-slate-400 font-mono">${upg.desc}</span>
                                </div>
                            </div>
                            <span class="text-[11px] font-bold font-mono text-orange-400">${upg.cost.toLocaleString()} 🥟</span>
                        </div>
                    `;
                });
            }

            const skinObj = game.skinsData[game.activeSkin];
            const emojiEl = document.getElementById('dumplingEmoji');
            if (emojiEl) emojiEl.innerText = skinObj ? skinObj.emoji : '🎃';

            renderSkinsModal();
            renderPetsModal();
            renderSkillsModal();
        }

        function handleTap(event) {
            const mult = getStatsMultiplier();
            const isCrit = Math.random() < mult.crit;
            const baseGain = game.clickPower * mult.click;
            const earned = isCrit ? baseGain * 10 : baseGain;

            game.dumplings += earned;
            game.totalEarned += earned;
            game.stats.totalTaps++;

            AudioEngine.play(isCrit ? 'crit' : 'tap');
            const clientX = event.clientX || (event.touches && event.touches[0].clientX);
            const clientY = event.clientY || (event.touches && event.touches[0].clientY);
            spawnFloatingValue(clientX, clientY, `+${Math.floor(earned)}`, isCrit);
            updateUI();
        }

        function spawnFloatingValue(x, y, text, isCrit) {
            const el = document.createElement('div');
            el.className = `float-val ${isCrit ? 'text-purple-400 text-lg font-black drop-shadow-lg' : 'text-orange-400 text-sm'}`;
            el.innerText = text;
            if (!x || !y) { x = window.innerWidth / 2; y = window.innerHeight / 2; }
            el.style.left = `${x}px`; el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 750);
        }

        function buyUpgrade(id) {
            const upg = game.upgrades[id];
            if (upg && game.dumplings >= upg.cost) {
                game.dumplings -= upg.cost;
                upg.count++;
                upg.cost = Math.floor(upg.cost * 1.35);
                recalcCPS();
                AudioEngine.play('buy');
                updateUI();
            }
        }

        function recalcCPS() {
            let total = 0;
            for (let k in game.upgrades) {
                if (game.upgrades[k]) total += (game.upgrades[k].count || 0) * (game.upgrades[k].cps || 0);
            }
            for (let k in game.pets) {
                if (game.pets[k]) total += (game.pets[k].count || 0) * (game.pets[k].cps || 0);
            }
            game.cps = total;
        }

        function createNewPromo() {
            const keyInput = document.getElementById('inputSecretKey').value.trim();
            const codeInput = document.getElementById('newPromoName').value.trim().toUpperCase();
            const amountInput = parseInt(document.getElementById('newPromoAmount').value);
            const msg = document.getElementById('creatorMessage');

            if (keyInput !== 'mkomko00mkomko0') {
                msg.style.color = '#ef4444';
                msg.innerText = 'Невірний ключ!';
                return;
            }

            if (!codeInput || isNaN(amountInput) || amountInput <= 0) {
                msg.style.color = '#ef4444';
                msg.innerText = 'Заповніть поля!';
                return;
            }

            game.promoCodes[codeInput] = amountInput;
            msg.style.color = '#10b981';
            msg.innerText = `Створено: ${codeInput} (+${amountInput})`;
            AudioEngine.play('buy');
            document.getElementById('newPromoName').value = '';
            document.getElementById('newPromoAmount').value = '';
        }

        function activatePromoCode() {
            const code = document.getElementById('inputPromoCode').value.trim().toUpperCase();
            const msg = document.getElementById('promoMessage');

            if (!game.promoCodes[code]) {
                msg.style.color = '#ef4444';
                msg.innerText = 'Недійсний код!';
                return;
            }

            if (game.usedPromos.includes(code)) {
                msg.style.color = '#f59e0b';
                msg.innerText = 'Вже використано!';
                return;
            }

            const reward = game.promoCodes[code];
            game.dumplings += reward;
            game.usedPromos.push(code);
            msg.style.color = '#10b981';
            msg.innerText = `Отримано +${reward.toLocaleString()} 🥟!`;
            AudioEngine.play('crit');
            document.getElementById('inputPromoCode').value = '';
            updateUI();
        }

        setInterval(() => {
            for (let key in game.market) {
                let item = game.market[key];

                item.timeLeft--;
                if (item.timeLeft <= 0) {
                    item.timeLeft = item.interval;
                    const delta = Math.floor(Math.random() * (item.price * 0.4)) - Math.floor(item.price * 0.2);
                    item.price = Math.max(15, item.price + delta);
                }
            }
            const marketModal = document.getElementById('modalMarket');
            if (marketModal && !marketModal.classList.contains('hidden')) {
                renderMarketModal();
            }
        }, 1000);

            const container = document.getElementById('marketItemsContainer');
            if (!container) return;

                let item = game.market[key];
                if (!item) continue;

                            <div>
                                <h4 class="font-bold text-white text-xs">${item.name}</h4>

                            </div>

                        </div>
                    </div>
                `;
            }
        }

        function tradeMarket(key, action) {
            let item = game.market[key];
            if (!item) return;
            if (action === 'buy' && game.dumplings >= item.price) {
                game.dumplings -= item.price;
                item.holdings++;
                AudioEngine.play('buy');
                renderMarketModal();
                updateUI();
            } else if (action === 'sell' && item.holdings > 0) {
                item.holdings--;
                game.dumplings += item.price;
                AudioEngine.play('buy');
                renderMarketModal();
                updateUI();
            }
        }

            const container = document.getElementById('skinsContainer');
            if (!container) return;
            container.innerHTML = '';

                updateUI();

            const container = document.getElementById('skillsContainer');
            if (!container) return;

                let s = game.skills[key];

        }

        function openModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.remove('hidden');
            if (id === 'modalProfile') renderProfileModal();
            if (id === 'modalMarket') renderMarketModal();
            if (id === 'modalSkins') renderSkinsModal();
            if (id === 'modalPets') renderPetsModal();
            if (id === 'modalSkills') renderSkillsModal();
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.add('hidden');
        }

        setInterval(() => {
            const mult = getStatsMultiplier();
            if (game.cps > 0) {
                const gain = (game.cps * mult.cps) / 10;
                game.dumplings += gain;
                game.totalEarned += gain;
                updateUI();
            }
        }, 100);

        function confirmReset() {
            if (confirm('Скинути весь прогрес?')) {
                localStorage.removeItem('halloween_mobile_save');
                location.reload();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('halloween_mobile_save');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    game = { ...game, ...parsed };
                    if (parsed.upgrades) {
                        for (let k in parsed.upgrades) {
                            if (game.upgrades[k] && parsed.upgrades[k]) {
                                game.upgrades[k].count = parsed.upgrades[k].count || 0;
                                game.upgrades[k].cost = parsed.upgrades[k].cost || game.upgrades[k].cost;
                            }
                        }
                    }
                    recalcCPS();
                } catch(e) {}
            }
            updateUI();
        });

        setInterval(() => {
            localStorage.setItem('halloween_mobile_save', JSON.stringify(game));
        }, 5000);
    </script>
</body>
</html>
